name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm --workspace=apps/api run lint

      - name: Lint web
        run: npm --workspace=apps/web run lint

      - name: Run API unit tests
        run: npm --workspace=apps/api run test -- --runInBand

      - name: Run API e2e tests
        run: npm --workspace=apps/api run test:e2e -- --runInBand

      - name: Run web tests
        run: npm --workspace=apps/web run test

      - name: Build all workspaces
        run: npm run build
